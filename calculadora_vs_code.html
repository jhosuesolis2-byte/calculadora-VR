<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Corporativa - Alexander GMB</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#8CC63F',     /* Verde vibrante del logo */
                            greenHover: '#A1D953',
                            greenDark: '#1E2C1A',
                            darkBg: '#0F1215',    /* Fondo general ultrasuave */
                            panelBg: '#171B20',   /* Panel de la calculadora */
                            btnDark: '#22272E',    /* Botones numéricos */
                            btnDarkHover: '#2C323B',
                            btnOp: '#1C2517',      /* Botones de operador */
                            accentDark: '#12161A',
                            textMuted: '#8B949E'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at 50% 0%, #1c2718 0%, #0f1215 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Glassmorphism visual depth */
        .glass-panel {
            background: rgba(23, 27, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(140, 198, 63, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(140, 198, 63, 0.05);
        }

        .btn-press {
            transition: all 0.12s ease-in-out;
            touch-action: manipulation;
        }
        .btn-press:active {
            transform: scale(0.94);
        }

        /* Smooth scrollbars for calculation history */
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(140, 198, 63, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-3 sm:p-6 text-slate-100">

    <main class="w-full max-w-md glass-panel rounded-3xl p-5 sm:p-6 shadow-2xl relative overflow-hidden">
        <!-- Accent Glow background effect -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-brand-green/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header / Branding Section -->
        <header class="flex items-center justify-between pb-4 border-b border-white/10 mb-5">
            <div class="flex items-center gap-3">
                <!-- Contenedor del Logo con fallback dinámico -->
                <div class="relative h-12 px-2 bg-white/5 rounded-xl border border-brand-green/30 flex items-center justify-center overflow-hidden">
                    <img id="companyLogo" 
                         src="image_33ba45.png" 
                         alt="Grupo Mario Bravo" 
                         class="h-full max-w-[140px] object-contain"
                         onerror="this.onerror=null; this.src='logo.png'; this.onerror=function(){ this.parentElement.innerHTML='<div class=\'text-brand-green font-bold text-sm tracking-tight\'>GRUPO MARIO BRAVO</div>'; };">
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-white leading-tight">Alexander GMB</h1>
                    <p class="text-xs font-medium text-brand-green flex items-center gap-1">
                        <span>Sistema de Cálculo</span>
                        <span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-green animate-pulse"></span>
                    </p>
                </div>
            </div>

            <button id="toggleSciBtn" onclick="toggleScientificMode()" class="px-2.5 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-xs text-brand-green font-medium transition flex items-center gap-1.5">
                <i data-lucide="calculator" class="w-3.5 h-3.5"></i>
                <span id="modeText">Científica</span>
            </button>
        </header>

        <!-- Display Screen -->
        <section class="bg-brand-darkBg/90 rounded-2xl p-4 mb-5 border border-white/5 flex flex-col justify-end min-h-[120px] text-right shadow-inner">
            <!-- Full Expression / History -->
            <div id="historyDisplay" class="font-mono text-xs text-brand-textMuted min-h-[1.25rem] overflow-x-auto custom-scrollbar whitespace-nowrap mb-1">
                <!-- Expressing sequence dynamically -->
            </div>
            <!-- Main Result Output -->
            <div id="mainDisplay" class="font-mono text-3xl sm:text-4xl font-bold text-white overflow-x-auto custom-scrollbar whitespace-nowrap tracking-tight">
                0
            </div>
        </section>

        <!-- Mode Scientific Panels (Hidden by default, expandable) -->
        <div id="scientificPanel" class="hidden grid-cols-4 gap-2 mb-2 transition-all duration-300">
            <button onclick="appendFunction('sin')" class="btn-press py-2 bg-brand-btnDark hover:bg-brand-btnDarkHover text-brand-green font-mono text-xs rounded-xl border border-white/5">sin</button>
            <button onclick="appendFunction('cos')" class="btn-press py-2 bg-brand-btnDark hover:bg-brand-btnDarkHover text-brand-green font-mono text-xs rounded-xl border border-white/5">cos</button>
            <button onclick="appendFunction('tan')" class="btn-press py-2 bg-brand-btnDark hover:bg-brand-btnDarkHover text-brand-green font-mono text-xs rounded-xl border border-white/5">tan</button>

            <button onclick="appendFunction('sqrt')" class="btn-press py-2 bg-brand-btnDark hover:bg-brand-btnDarkHover text-brand-green font-mono text-xs rounded-xl border border-white/5">√</button>
            <button onclick="appendSymbol('^')" class="btn-press py-2 bg-brand-btnDark hover:bg-brand-btnDarkHover text-brand-green font-mono text-xs rounded-xl border border-white/5">x^y</button>
            <button onclick="appendFunction('log')" class="btn-press py-2 bg-brand-btnDark hover:bg-brand-btnDarkHover text-brand-green font-mono text-xs rounded-xl border border-white/5">log</button>
            <button onclick="appendSymbol('π')" class="btn-press py-2 bg-brand-btnDark hover:bg-brand-btnDarkHover text-brand-green font-mono text-xs rounded-xl border border-white/5">π</button>
            <button onclick="appendSymbol('e')" class="btn-press py-2 bg-brand-btnDark hover:bg-brand-btnDarkHover text-brand-green font-mono text-xs rounded-xl border border-white/5">e</button>
        </div>

        <!-- Standard Keypad -->
        <section class="grid grid-cols-4 gap-2.5">
            <!-- Row 1 -->
            <button onclick="clearAll()" class="btn-press py-3.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-semibold text-sm rounded-xl border border-red-500/20">AC</button>
            <button onclick="deleteLast()" class="btn-press py-3.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 font-semibold text-sm rounded-xl border border-amber-500/20 flex items-center justify-center">
                <i data-lucide="backspace" class="w-4 h-4"></i>
            </button>
            <button onclick="appendSymbol('%')" class="btn-press py-3.5 bg-brand-btnOp hover:bg-brand-greenDark text-brand-green font-bold text-sm rounded-xl border border-brand-green/20">%</button>
            <button onclick="appendOperator('/')" class="btn-press py-3.5 bg-brand-btnOp hover:bg-brand-greenDark text-brand-green font-bold text-base rounded-xl border border-brand-green/20">÷</button>

            <!-- Row 2 -->
            <button onclick="appendNumber('7')" class="btn-press py-3.5 bg-brand-btnDark hover:bg-brand-btnDarkHover text-white font-semibold text-lg rounded-xl border border-white/5">7</button>
            <button onclick="appendNumber('8')" class="btn-press py-3.5 bg-brand-btnDark hover:bg-brand-btnDarkHover text-white font-semibold text-lg rounded-xl border border-white/5">8</button>
            <button onclick="appendNumber('9')" class="btn-press py-3.5 bg-brand-btnDark hover:bg-brand-btnDarkHover text-white font-semibold text-lg rounded-xl border border-white/5">9</button>
            <button onclick="appendOperator('*')" class="btn-press py-3.5 bg-brand-btnOp hover:bg-brand-greenDark text-brand-green font-bold text-base rounded-xl border border-brand-green/20">×</button>

            <!-- Row 3 -->
            <button onclick="appendNumber('4')" class="btn-press py-3.5 bg-brand-btnDark hover:bg-brand-btnDarkHover text-white font-semibold text-lg rounded-xl border border-white/5">4</button>
            <button onclick="appendNumber('5')" class="btn-press py-3.5 bg-brand-btnDark hover:bg-brand-btnDarkHover text-white font-semibold text-lg rounded-xl border border-white/5">5</button>
            <button onclick="appendNumber('6')" class="btn-press py-3.5 bg-brand-btnDark hover:bg-brand-btnDarkHover text-white font-semibold text-lg rounded-xl border border-white/5">6</button>
            <button onclick="appendOperator('-')" class="btn-press py-3.5 bg-brand-btnOp hover:bg-brand-greenDark text-brand-green font-bold text-lg rounded-xl border border-brand-green/20">-</button>

            <!-- Row 4 -->
            <button onclick="appendNumber('1')" class="btn-press py-3.5 bg-brand-btnDark hover:bg-brand-btnDarkHover text-white font-semibold text-lg rounded-xl border border-white/5">1</button>
            <button onclick="appendNumber('2')" class="btn-press py-3.5 bg-brand-btnDark hover:bg-brand-btnDarkHover text-white font-semibold text-lg rounded-xl border border-white/5">2</button>
            <button onclick="appendNumber('3')" class="btn-press py-3.5 bg-brand-btnDark hover:bg-brand-btnDarkHover text-white font-semibold text-lg rounded-xl border border-white/5">3</button>
            <button onclick="appendOperator('+')" class="btn-press py-3.5 bg-brand-btnOp hover:bg-brand-greenDark text-brand-green font-bold text-lg rounded-xl border border-brand-green/20">+</button>

            <!-- Row 5 -->
            <button onclick="appendNumber('0')" class="btn-press py-3.5 bg-brand-btnDark hover:bg-brand-btnDarkHover text-white font-semibold text-lg rounded-xl border border-white/5">0</button>
            <button onclick="appendNumber('.')" class="btn-press py-3.5 bg-brand-btnDark hover:bg-brand-btnDarkHover text-white font-semibold text-lg rounded-xl border border-white/5">.</button>
            <button onclick="calculate()" class="btn-press col-span-2 py-3.5 bg-brand-green hover:bg-brand-greenHover text-brand-darkBg font-bold text-lg rounded-xl shadow-lg shadow-brand-green/20 transition-all flex items-center justify-center gap-1">
                =
            </button>
        </section>

        <!-- Footer Notice -->
        <footer class="mt-5 pt-3 border-t border-white/5 text-center flex items-center justify-between text-[11px] text-brand-textMuted">
            <span class="text-brand-green/80 font-mono">Alexander GMB</span>
            <span class="text-brand-textMuted/60 font-mono">v2.6</span>
        </footer>
    </main>

    <!-- Logic Script -->
    <script>
        // Init Lucide Icons
        lucide.createIcons();

        let currentInput = '0';
        let historyExpr = '';
        let resetNext = false;
        let isScientificMode = false;

        const mainDisplay = document.getElementById('mainDisplay');
        const historyDisplay = document.getElementById('historyDisplay');
        const scientificPanel = document.getElementById('scientificPanel');
        const modeText = document.getElementById('modeText');

        function updateDisplay() {
            mainDisplay.textContent = currentInput;
            historyDisplay.textContent = historyExpr;
        }

        function toggleScientificMode() {
            isScientificMode = !isScientificMode;
            if (isScientificMode) {
                scientificPanel.classList.remove('hidden');
                scientificPanel.classList.add('grid');
                modeText.textContent = 'Básica';
            } else {
                scientificPanel.classList.remove('grid');
                scientificPanel.classList.add('hidden');
                modeText.textContent = 'Científica';
            }
        }

        function appendNumber(num) {
            if (currentInput === '0' || resetNext) {
                currentInput = num;
                resetNext = false;
            } else {
                if (num === '.' && currentInput.includes('.')) return;
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (resetNext) resetNext = false;
            const lastChar = currentInput.slice(-1);
            if (['+', '-', '*', '/'].includes(lastChar)) {
                currentInput = currentInput.slice(0, -1) + op;
            } else {
                currentInput += op;
            }
            updateDisplay();
        }

        function appendSymbol(sym) {
            if (currentInput === '0' || resetNext) {
                currentInput = sym;
                resetNext = false;
            } else {
                currentInput += sym;
            }
            updateDisplay();
        }

        function appendFunction(fn) {
            if (currentInput === '0' || resetNext) {
                currentInput = fn + '(';
                resetNext = false;
            } else {
                currentInput += fn + '(';
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            historyExpr = '';
            resetNext = false;
            updateDisplay();
        }

        function deleteLast() {
            if (resetNext) {
                clearAll();
                return;
            }
            if (currentInput.length <= 1) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function calculate() {
            try {
                historyExpr = currentInput + ' =';
                let parsed = currentInput
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/%/g, '/100')
                    .replace(/\^/g, '**')
                    .replace(/π/g, 'Math.PI')
                    .replace(/e/g, 'Math.E')
                    .replace(/sin\(/g, 'Math.sin(')
                    .replace(/cos\(/g, 'Math.cos(')
                    .replace(/tan\(/g, 'Math.tan(')
                    .replace(/sqrt\(/g, 'Math.sqrt(')
                    .replace(/log\(/g, 'Math.log10(');

                // Auto-close missing parentheses
                const openParens = (parsed.match(/\(/g) || []).length;
                const closeParens = (parsed.match(/\)/g) || []).length;
                if (openParens > closeParens) {
                    parsed += ')'.repeat(openParens - closeParens);
                }

                let evalResult = Function('"use strict"; return (' + parsed + ')')();

                if (!isFinite(evalResult) || isNaN(evalResult)) {
                    currentInput = 'Error';
                } else {
                    currentInput = String(Number(evalResult.toFixed(8)));
                }
            } catch (err) {
                currentInput = 'Error';
            }
            resetNext = true;
            updateDisplay();
        }

        // Keyboard Support
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            else if (e.key === '.') appendNumber('.');
            else if (e.key === '+') appendOperator('+');
            else if (e.key === '-') appendOperator('-');
            else if (e.key === '*') appendOperator('*');
            else if (e.key === '/') appendOperator('/');
            else if (e.key === '%') appendSymbol('%');
            else if (e.key === 'Enter' || e.key === '=') calculate();
            else if (e.key === 'Backspace') deleteLast();
            else if (e.key === 'Escape') clearAll();
        });
    </script>
</body>
</html>
